services:
  - type: web
    name: resume-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: USE_SAGEMAKER
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"
